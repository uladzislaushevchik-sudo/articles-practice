<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles Practice</title>
<style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f6f3fa}.s{width:28px;height:28px;border:3px solid #ccc;border-top-color:#4A148C;border-radius:50%;animation:a .8s linear infinite;margin:0 auto 12px}@keyframes a{to{transform:rotate(360deg)}}</style></head><body>
<div style="text-align:center"><div class="s"></div><div id="m">Загрузка…</div></div>
<script>
const BASE="https://cdn.jsdelivr.net/gh/uladzislaushevchik-sudo/articles-practice@main/";
async function load(){
  const parts=await Promise.all([0,1,2,3,4,5].map(i=>fetch(BASE+"aq"+i+".txt").then(r=>{if(!r.ok)throw new Error(r.status+" aq"+i);return r.text()})));
  const B64=parts.map(s=>s.trim()).join("");
  const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
  const raw=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  document.open();document.write(new TextDecoder().decode(raw));document.close();
}
load().catch(e=>{document.getElementById("m").textContent="Ошибка: "+e});
</script></body></html>
