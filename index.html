<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles Practice · loading…</title>
<style>
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f6f3fa;color:#1a1a1a}
.box{text-align:center;padding:24px}
.spin{width:36px;height:36px;border:3px solid #ddd5e8;border-top-color:#4A148C;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><div id="msg">Загрузка Articles Practice…</div></div>
<script>
(async function () {
  const n = 7;
  try {
    const parts = [];
    for (let i = 0; i < n; i++) {
      const r = await fetch('p' + i + '.txt?v=3');
      if (!r.ok) throw new Error('chunk p' + i + ' ' + r.status);
      parts.push((await r.text()).trim());
    }
    const b64 = parts.join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('msg').innerHTML = 'Ошибка загрузки. <a href="https://github.com/uladzislaushevchik-sudo/articles-practice/upload/main">Загрузите Articles_Practice.html как articles.html</a><br>' + e;
  }
})();
</script>
</body>
</html>
